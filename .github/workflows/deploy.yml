name: Deploy documentation and app

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 1,5,10 * *"
  workflow_dispatch:
    inputs:
      collect:
        description: Check the Ministry for a new monthly release
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install Python package
        run: python -m pip install -e '.[test]'
      - name: Test the data pipeline
        run: pytest
      - name: Collect the next monthly release
        id: collection
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: python -m nomenclator_delta.update
      - name: Validate committed static data
        run: python -m nomenclator_delta validate data
      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs-site
      - name: Type-check documentation
        run: npm run typecheck
        working-directory: docs-site
      - name: Build documentation and embedded app
        run: npm run build
        working-directory: docs-site
      - name: Verify complete static output
        run: |
          test -f docs-site/build/search-index.json
          test -f docs-site/build/app/index.html
          test -f docs-site/build/app/data/metadata.json
      - name: Persist validated data and source archive
        if: steps.collection.outputs.status == 'updated' || steps.collection.outputs.status == 'gap'
        run: |
          git add data sources/archive
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update monthly Nomenclator data and source archive"
            git push origin HEAD:main
          fi
      - name: Stop if monthly history has a gap
        if: steps.collection.outputs.status == 'gap'
        run: |
          echo 'Missing monthly source: see collection summary. New source archived; published data unchanged.' >&2
          exit 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
