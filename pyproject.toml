[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nomenclator-delta"
version = "0.1.0"
description = "Searchable presentation-level change histories from Spain's official Nomenclátor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8", "requests-mock>=1.12"]

[project.scripts]
nomenclator-delta = "nomenclator_delta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
